<!DOCTYPE html>
<html>
<head>
  <title>Button Click Example</title>
</head>
<body>

  <h2 id="text">Hello guys</h2>

  <button onclick="changeText()">Click Me</button>

  <script>
    function changeText() {
      document.getElementById("text").innerHTML = "Text Changed!";
    }
  </script>

</body>
</html>
